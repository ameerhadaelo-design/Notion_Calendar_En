<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Calendar Widget</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Playfair+Display&family=Caveat&family=Pacifico&family=Space+Mono&family=Quicksand&family=Pixelify+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffafb;--fg:#3b3335;--grid:#ecdfe2;--accent:#e58fa8;--panel:#fff;--r:14px;--ch:84px;--font:'DM Sans',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a1c;--fg:#f1e8ea;--grid:#3a3336;--panel:#2a2528;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a1c;--fg:#f1e8ea;--grid:#3a3336;--panel:#2a2528;color-scheme:dark}
html{background:var(--pg,transparent)}
body{margin:0;padding:10px;background:var(--pg,transparent);color:var(--fg);font-family:var(--font)}
button,input,select{font:inherit;color:var(--fg)}
.b{border:1px solid var(--grid);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer}
.b.a{background:var(--accent);border-color:var(--accent);color:#fff}
input,select{background:var(--bg);border:1px solid var(--grid);border-radius:8px;padding:3px 6px;max-width:100%}
#top,.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sp{flex:1}
#ttl{font-size:1.35rem;min-width:120px;text-align:center}
#set{display:none;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--grid);border-radius:var(--r);padding:10px;margin-bottom:8px;font-size:.8rem}
#set.on{display:flex}
#set label{display:flex;align-items:center;gap:4px}
#wrap{position:relative}
#wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:.75rem;padding:4px 0;color:color-mix(in srgb,var(--fg) 70%,transparent)}
#wk.bx{padding:8px 0;border-radius:var(--r) var(--r) 0 0}
#wk.bx+#grid{border-radius:0 0 var(--r) var(--r)}
#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;background:transparent;border:0;border-radius:var(--r);overflow:hidden}
#grid.nogrid .day{box-shadow:none}
.day{box-shadow:inset 0 0 0 .5px var(--grid);min-height:var(--ch);padding:3px;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;user-select:none}
.day.blank{cursor:default;box-shadow:none}
.n{font-size:.75rem;opacity:.85;display:inline-block}
.td{background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;opacity:1}
.ev{font-size:.66rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{color:var(--accent);font-style:normal;margin-right:3px}
.has .n,.has .ev{color:#fff;text-shadow:0 1px 3px #000a}
#st{position:absolute;inset:0;pointer-events:none}
.s{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;user-select:none}
.s img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
.s.sel{outline:1.5px dashed var(--accent)}
.h{display:none;position:absolute;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;touch-action:none;color:#fff;font-size:11px;line-height:18px;text-align:center}
.s.sel .h{display:block}
.rs{right:-9px;bottom:-9px;cursor:nwse-resize}
.rw{right:-9px;top:calc(50% - 9px);cursor:ew-resize;border-radius:4px;width:10px}
.rh{bottom:-9px;left:calc(50% - 9px);cursor:ns-resize;border-radius:4px;height:10px}
.ro{left:calc(50% - 9px);top:-30px;cursor:grab}
.dl{right:-9px;top:-9px;cursor:pointer}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--grid);cursor:pointer;padding:0}
#frame{position:relative;box-sizing:border-box;background:var(--bg);border:1px solid var(--grid);border-radius:var(--r);padding:12px}
#mv{position:absolute;left:-8px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;text-align:center;line-height:24px;font-size:13px;cursor:move;touch-action:none;z-index:6;opacity:.9;user-select:none}
body.retro #tb{cursor:move;touch-action:none}
#ph{position:relative;margin-bottom:8px}
#hw:not(.has) #hd{display:none}
#hw.has #hd{border-radius:var(--r)}
#ph.on{overflow:hidden;border-radius:var(--r);cursor:grab;touch-action:none;background:var(--grid)}
.hi{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;pointer-events:none}
.hc{position:absolute;bottom:6px;right:6px;display:flex;gap:4px;z-index:3}
#hw.has{display:grid;margin-bottom:8px}
#hw.has>*{grid-area:1/1;margin:0!important}
#hw.has #top{position:relative;z-index:2;align-self:start;background:none!important;padding:8px 10px;pointer-events:none;color:var(--ht,#fff);text-shadow:var(--hs,0 1px 3px #0005)}
#hw.has #top>*{pointer-events:auto}
#hw.has #top .b{text-shadow:none}
.hc .b{background:#fffd;color:#333;border:0}
body.retro #ph.on,body.retro #hw.has #hd{border-radius:0}
#rz{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--accent) 50%);border-radius:0 0 var(--r) 0;z-index:5;opacity:.85}
#tb{display:none}
body.retro #frame{border:2px solid var(--accent);border-radius:var(--r);background:var(--bg);padding:0}
body.retro #tb{display:flex;align-items:center;gap:10px;background:var(--accent);padding:10px 14px;border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0}
#tb b{color:#fff;font-weight:400;font-size:.95rem;line-height:1}
#tb i{flex:1;height:12px;background:var(--bg);border-radius:99px;margin-left:8px}
body.retro #body{padding:12px 14px}
body.retro #top{background:color-mix(in srgb,var(--accent) 55%,var(--bg));padding:8px 10px;margin-bottom:8px}
body.retro #gr{order:-2;background:#fff;color:#444;border:0;padding:6px 10px}
body.retro #pv{order:-1}
body.retro .b{border-radius:0}
body.retro #ttl{font-size:1.1rem;min-width:150px}
body.retro #grid{border:0;border-radius:0;gap:0;background:transparent}
body.retro .day{background-color:transparent;box-shadow:inset 0 0 0 .5px var(--grid)}
body.retro .day.today{outline:2px solid var(--fg);outline-offset:-2px}
body.retro .td{background:none;color:inherit;padding:0;border-radius:0}
body.retro .ev{text-transform:uppercase;font-size:.58rem}
#cpw{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:55;padding:12px}
#wheel{width:180px;height:180px;border-radius:50%;touch-action:none;cursor:crosshair;display:block;margin:8px auto}
#ed{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.card{background:var(--panel);border-radius:var(--r);padding:14px;width:min(340px,100%);max-height:90%;overflow:auto}
#evl .row{justify-content:space-between;font-size:.85rem;margin:4px 0}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:6px 14px;border-radius:999px;font-size:.8rem;display:none;z-index:60}
</style></head><body>
<div id="frame"><div id="tb"><b>●</b><b>■</b><b>▲</b><i></i></div><div id="body">
<div id="ph"></div>
<div id="hw"><div id="hd"></div>
<div id="top">
  <button class="b" id="pv">‹</button><div id="ttl"></div><button class="b" id="nx">›</button>
  <span class="sp"></span>
  <button class="b" id="td">Today</button><button class="b a" id="ast">＋ Sticker</button><button class="b" id="gr">⚙</button><span id="cs" style="font-size:.7rem;opacity:.6"></span>
</div></div>
<div id="set">
  <label>Style <select data-s="style"><option value="plain">Classic</option><option value="retro">Retro window</option></select></label>
  <label>Theme <select data-s="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Font <select data-s="font"><option value="'DM Sans',system-ui,sans-serif">DM Sans</option><option value="'Playfair Display',serif">Playfair</option><option value="'Caveat',cursive">Caveat</option><option value="'Pacifico',cursive">Pacifico</option><option value="'Space Mono',monospace">Space Mono</option><option value="'Quicksand',sans-serif">Quicksand</option><option value="'Pixelify Sans',monospace">Pixel</option></select></label>
  <label>Symbol <select data-s="shape"><option>●</option><option>■</option><option>♥</option><option>★</option><option>◆</option><option>☾</option></select></label>
  <label>Weekdays <select data-s="wk"><option value="short">Mon</option><option value="init">M</option></select></label>
  <label>Accent <button class="sw" data-c="accent"></button></label>
  <label>Box color <button class="sw" data-c="bg"></button></label><label>Page background <button class="sw" id="pgs"></button></label><button class="b" id="pgx">None</button><label>Weekday bar <button class="sw" id="wbs"></button></label><button class="b" id="wbx">None</button><label>Days box <button class="sw" id="gbs"></button></label><button class="b" id="gbx">None</button>
  <label>Text <button class="sw" data-c="fg"></button></label>
  <label>Grid <button class="sw" data-c="grid"></button></label>
  <button class="b" id="rc">Reset colors</button>
  <label>Corners <button class="b" id="cur">Curved</button><button class="b" id="sqr">Square</button></label>
  <label><input type="checkbox" data-s="grid"> Grid</label>
  <label><input type="checkbox" data-s="title"> Title</label>
  <label>Day height <input type="range" min="40" max="600" data-s="ch"></label><label>Scale <input type="range" min="30" max="400" data-s="sc"></label><label>Photo height <input type="range" min="40" max="500" data-s="hh"></label><label>Header color <button class="sw" id="hcs"></button></label><button class="b" id="hcx">No color</button><button class="b" id="fit">Fit to window</button>
</div>
<div id="wrap"><div id="wk"></div><div id="grid"></div><div id="st"></div></div></div><div id="rz" title="Drag to resize"></div><div id="mv" title="Drag to move">✥</div></div>

<div id="ed"><div class="card">
  <b id="edd"></b><div id="evl"></div>
  <div class="row"><input id="evt" placeholder="Add event" style="flex:1;min-width:0"><input id="evm" type="time"><button class="b a" id="add">Add</button></div>
  <div class="row"><button class="b" id="phb"></button><button class="b" id="phr">Remove photo</button><span class="sp"></span><button class="b" id="cl">Done</button></div>
</div></div>
<div id="cpw"><div class="card" style="width:min(260px,100%);text-align:center"><b id="cpt"></b><canvas id="wheel" width="180" height="180"></canvas><label class="row" style="justify-content:center">Brightness <input type="range" id="val" min="0" max="100"></label><label class="row" style="justify-content:center">Opacity <input type="range" id="alpha" min="0" max="100"></label><div class="row" style="justify-content:center"><input id="hex" maxlength="9" placeholder="#hex" style="width:104px;text-align:center"><button class="b a" id="cpd">Done</button></div></div></div>
<input type="file" accept="image/*" id="pf" hidden><input type="file" accept="image/*" id="hf" hidden><input type="file" accept="image/*" id="sf" hidden>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),K='cw1';
let S={style:'plain',hd:{},hh:90,cw:0,sc:100,theme:'system',font:"'DM Sans',system-ui,sans-serif",shape:'♥',round:true,grid:true,title:true,wk:'short',ch:84,c:{},ev:{},ph:{},st:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
let cur=new Date();cur.setDate(1);let sel=null,dk=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,mk=()=>`${cur.getFullYear()}-${pad(cur.getMonth()+1)}`;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function save(){S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!DB)toast('Storage full – remove some photos')}push()}
function apply(){const r=document.documentElement;r.dataset.theme=S.theme==='system'?'':S.theme;S.pg?r.style.setProperty('--pg',S.pg):r.style.removeProperty('--pg');document.body.classList.toggle('retro',S.style==='retro');const fr=$('#frame');fr.style.width=S.cw?S.cw+'px':'';fr.style.zoom=S.sc/100;fr.style.left=(S.ox||0)+'px';fr.style.top=(S.oy||0)+'px';
  r.style.setProperty('--font',S.font);r.style.setProperty('--ch',S.ch+'px');r.style.setProperty('--r',S.round?'14px':'0px');
  ['accent','bg','fg','grid'].forEach(k=>S.c[k]?r.style.setProperty('--'+k,S.c[k]):r.style.removeProperty('--'+k));paintSw()}
function shrink(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.82))};im.src=r.result};r.readAsDataURL(f)})}
function render(){
  const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=new Date();
  $('#ttl').textContent=S.title?cur.toLocaleDateString(undefined,{month:'long',year:'numeric'}):'';
  $('#wk').innerHTML=[...Array(7)].map((_,i)=>`<div>${new Date(2023,0,1+i).toLocaleDateString(undefined,{weekday:S.wk==='init'?'narrow':'short'})}</div>`).join('');
  let h='';for(let i=0;i<first;i++)h+='<div class="day blank"></div>';
  for(let d=1;d<=n;d++){const k=key(y,m,d),e=S.ev[k]||[],p=S.ph[k],isT=t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d;
    h+=`<div class="day${p?' has':''}${isT?' today':''}" data-k="${k}"${p?` style="background-image:url('${p}')"`:''}><span class="n${isT?' td':''}">${d}</span>`
    +e.slice(0,3).map(x=>`<div class="ev"><i>${S.shape}</i>${x.tm?x.tm+' ':''}${esc(x.t)}</div>`).join('')+(e.length>3?`<div class="ev">+${e.length-3} more</div>`:'')+'</div>'}
  for(let i=0;i<(7-(first+n)%7)%7;i++)h+='<div class="day blank"></div>';
  $('#grid').className=S.grid?'':'nogrid';$('#grid').innerHTML=h;drawSt();drawHd();drawBx()}
function drawSt(){$('#st').innerHTML=(S.st[mk()]||[]).map(s=>`<div class="s${s.id===sel?' sel':''}" data-id="${s.id}" style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h!=null?s.h+'%':'auto'};transform:rotate(${s.r}deg)"><img src="${s.src}" alt=""><div class="h ro">↻</div><div class="h dl">×</div><div class="h rs"></div><div class="h rw"></div><div class="h rh"></div></div>`).join('')}
/* stickers */
$('#st').addEventListener('pointerdown',e=>{
  const el=e.target.closest('.s');if(!el)return;e.preventDefault();
  const L=S.st[mk()],s=L.find(z=>z.id===el.dataset.id),c=e.target.classList;
  if(c.contains('dl')){S.st[mk()]=L.filter(z=>z!==s);sel=null;save();drawSt();return}
  sel=s.id;document.querySelectorAll('.s').forEach(n=>n.classList.toggle('sel',n===el));
  const W=$('#wrap').getBoundingClientRect(),b=el.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
  if(s.h==null){s.h=el.offsetHeight/W.height*100;el.style.height=s.h+'%'}
  const mode=c.contains('rs')?'rs':c.contains('rw')?'rw':c.contains('rh')?'rh':c.contains('ro')?'ro':'mv',x0=e.clientX,y0=e.clientY,sx=s.x,sy=s.y,sw=s.w,sh=s.h,d0=Math.hypot(x0-cx,y0-cy)||1,rad=s.r*Math.PI/180;
  el.setPointerCapture(e.pointerId);
  const mv=ev=>{
    if(mode==='mv'){s.x=sx+(ev.clientX-x0)/W.width*100;s.y=sy+(ev.clientY-y0)/W.height*100;el.style.left=s.x+'%';el.style.top=s.y+'%'}
    else if(mode==='rs'){const k=Math.hypot(ev.clientX-cx,ev.clientY-cy)/d0;s.w=Math.max(2,sw*k);s.h=Math.max(2,sh*k);el.style.width=s.w+'%';el.style.height=s.h+'%'}
    else if(mode==='rw'||mode==='rh'){const dx=ev.clientX-x0,dy=ev.clientY-y0,lx=dx*Math.cos(rad)+dy*Math.sin(rad),ly=-dx*Math.sin(rad)+dy*Math.cos(rad);
      if(mode==='rw'){s.w=Math.max(2,sw+lx/W.width*100);el.style.width=s.w+'%'}else{s.h=Math.max(2,sh+ly/W.height*100);el.style.height=s.h+'%'}}
    else{s.r=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90;el.style.transform=`rotate(${s.r}deg)`}};
  const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);save()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.s')&&sel){sel=null;document.querySelectorAll('.s.sel').forEach(n=>n.classList.remove('sel'))}});
$('#ast').onclick=()=>$('#sf').click();
$('#sf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const src=await shrink(f,500),k=mk();
  const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src}),W=$('#wrap').getBoundingClientRect();
  const s={id:String(Date.now()),src,x:35,y:30,w:22,r:0,h:22*W.width/100*im.height/im.width/W.height*100};(S.st[k]=S.st[k]||[]).push(s);sel=s.id;save();drawSt()};
/* day editor */
function drawEd(){const e=S.ev[dk]||[];
  $('#edd').textContent=new Date(dk+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('#evl').innerHTML=e.map((x,i)=>`<div class="row"><span>${S.shape} ${x.tm||''} ${esc(x.t)}</span><button class="b" data-d="${i}">×</button></div>`).join('');
  $('#phb').textContent=S.ph[dk]?'Change photo':'Add photo';$('#phr').style.display=S.ph[dk]?'':'none'}
$('#grid').onclick=e=>{const d=e.target.closest('.day[data-k]');if(!d)return;dk=d.dataset.k;$('#ed').style.display='flex';drawEd();$('#evt').focus()};
const closeEd=()=>{$('#ed').style.display='none'};
$('#cl').onclick=closeEd;$('#ed').onclick=e=>{if(e.target.id==='ed')closeEd()};
function addEv(){const t=$('#evt').value.trim();if(!t)return;(S.ev[dk]=S.ev[dk]||[]).push({t,tm:$('#evm').value});$('#evt').value='';$('#evm').value='';save();render();drawEd()}
$('#add').onclick=addEv;$('#evt').onkeydown=e=>{if(e.key==='Enter')addEv()};
$('#evl').onclick=e=>{const i=e.target.dataset.d;if(i==null)return;S.ev[dk].splice(+i,1);if(!S.ev[dk].length)delete S.ev[dk];save();render();drawEd()};
$('#phb').onclick=()=>$('#pf').click();
$('#pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;S.ph[dk]=await shrink(f,400);save();render();drawEd()};
$('#phr').onclick=()=>{delete S.ph[dk];save();render();drawEd()};
/* nav + settings */
const go=n=>{cur.setMonth(cur.getMonth()+n);sel=null;render()};
$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#td').onclick=()=>{cur=new Date();cur.setDate(1);render()};
$('#gr').onclick=()=>$('#set').classList.toggle('on');
document.querySelectorAll('[data-s]').forEach(i=>{const k=i.dataset.s,cb=i.type==='checkbox';
  if(cb)i.checked=S[k];else i.value=S[k];
  i.oninput=()=>{S[k]=cb?i.checked:i.type==='range'?+i.value:i.value;save();apply();render()}});
/* color wheel */
const curCol=k=>S.c[k]||getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim()||'#888888';
function paintSw(){document.querySelectorAll('[data-c]').forEach(i=>i.style.background=curCol(i.dataset.c));$('#pgs').style.background=S.pg||'repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px'}
const hsv2rgb=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)].map(x=>Math.round(x*255))};
const toHex=(r,g,b)=>'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
const wc=$('#wheel'),wx=wc.getContext('2d'),WR=wc.width/2,CN={accent:'Accent',bg:'Box color',fg:'Text',grid:'Grid'};
let cp={k:null,h:0,s:0,v:1};
function drawWheel(){const n=wc.width,im=wx.createImageData(n,n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const dx=x-WR+.5,dy=y-WR+.5,r=Math.hypot(dx,dy);if(r<=WR){const[a,b,c]=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,r/WR,cp.v);im.data.set([a,b,c,255],(y*n+x)*4)}}
  wx.putImageData(im,0,0);const a=cp.h*Math.PI/180,px=WR+Math.cos(a)*cp.s*WR,py=WR+Math.sin(a)*cp.s*WR;
  wx.beginPath();wx.arc(px,py,8,0,7);wx.lineWidth=3;wx.strokeStyle='#0008';wx.stroke();wx.beginPath();wx.arc(px,py,7,0,7);wx.lineWidth=2;wx.strokeStyle='#fff';wx.stroke()}
function setC(skip){const x=toHex(...hsv2rgb(cp.h,cp.s,cp.v))+(cp.a<1?Math.round(cp.a*255).toString(16).padStart(2,'0'):'');if(cp.k==='hdc'){S.hc=x;drawHc()}else if(cp.k==='pgc'){S.pg=x;apply()}else if(cp.k==='wbc'){S.wb=x;drawBx()}else if(cp.k==='gbc'){S.gb=x;drawBx()}else{S.c[cp.k]=x;apply()}if(!skip)$('#hex').value=x;drawWheel()}
const loadHex=c=>{[cp.h,cp.s,cp.v]=rgb2hsv(...[1,3,5].map(i=>parseInt(c.substr(i,2),16)));$('#val').value=Math.round(cp.v*100);cp.a=c.length>7?parseInt(c.substr(7,2),16)/255:1;$('#alpha').value=Math.round(cp.a*100)};
document.querySelectorAll('[data-c]').forEach(i=>i.onclick=()=>{cp.k=i.dataset.c;$('#cpt').textContent=CN[cp.k];const c=curCol(cp.k);loadHex(HEX.test(c)?c:'#888888');$('#hex').value=c;$('#cpw').style.display='flex';drawWheel()});
const pick=e=>{const b=wc.getBoundingClientRect(),dx=(e.clientX-b.left)/b.width*wc.width-WR,dy=(e.clientY-b.top)/b.height*wc.height-WR;cp.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;cp.s=Math.min(1,Math.hypot(dx,dy)/WR);setC()};
wc.onpointerdown=e=>{wc.setPointerCapture(e.pointerId);pick(e);wc.onpointermove=pick};
wc.onpointerup=()=>{wc.onpointermove=null;save()};
$('#val').oninput=()=>{cp.v=$('#val').value/100;setC()};$('#val').onchange=save;$('#alpha').oninput=()=>{cp.a=$('#alpha').value/100;setC()};$('#alpha').onchange=save;
const normHex=(v,loose)=>{v=v.trim().replace(/^#/,'').toLowerCase();if(loose&&/^[0-9a-f]{3,4}$/.test(v))v=v.replace(/./g,'$&$&');return /^[0-9a-f]{6}([0-9a-f]{2})?$/.test(v)?'#'+v:null};
$('#hex').oninput=()=>{const x=normHex($('#hex').value);if(x){loadHex(x);setC(true)}};
$('#hex').onchange=()=>{const x=normHex($('#hex').value,true);if(x){loadHex(x);setC()}};
const closeCp=()=>{$('#cpw').style.display='none';save()};
$('#cpd').onclick=closeCp;$('#cpw').onclick=e=>{if(e.target.id==='cpw')closeCp()};
/* corners */
const corners=()=>{$('#cur').classList.toggle('a',S.round);$('#sqr').classList.toggle('a',!S.round)};
$('#cur').onclick=()=>{S.round=true;save();apply();corners()};$('#sqr').onclick=()=>{S.round=false;save();apply();corners()};corners();
$('#rc').onclick=()=>{S.c={};S.pg='';S.hc='';S.wb='';S.gb='';save();apply();drawHc();drawBx()};
/* cloud sync (only when opened signed in to claude.ai; otherwise stays on-device) */
let DB=null,UID=null,pt=null,lastW=[];const CH=180000;
const ser=()=>JSON.stringify(S).replace(/[\u007f-\uffff]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
function push(){if(!DB)return;clearTimeout(pt);pt=setTimeout(async()=>{try{const b='data/users/'+UID+'/',s=ser(),n=Math.ceil(s.length/CH)||1;
  for(let i=0;i<n;i++){const d=s.slice(i*CH,(i+1)*CH);if(lastW[i]!==d){await DB.doc(b+'calc'+i).set({d});lastW[i]=d}}
  await DB.doc(b+'calmeta').set({n,ts:S.ts});lastW.length=n;$('#cs').textContent='☁ synced'}catch(e){$('#cs').textContent='☁ failed'}},1500)}
async function initSync(){try{const[db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!u)return;const id=await u.id();if(!id)return;DB=db;UID=id;
  const b='data/users/'+id+'/',m=await DB.doc(b+'calmeta').get(),md=m.exists?m.data():null;
  if(md&&(md.ts||0)>(S.ts||0)){let s='';for(let i=0;i<md.n;i++){const c=await DB.doc(b+'calc'+i).get();s+=c.data().d;lastW[i]=c.data().d}
    Object.assign(S,JSON.parse(s));try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
    document.querySelectorAll('[data-s]').forEach(i=>{const k=i.dataset.s;if(i.type==='checkbox')i.checked=S[k];else i.value=S[k]});corners();apply();render();$('#cs').textContent='☁ synced'}
  else if(!md||(S.ts||0)>(md.ts||0)){if(S.ts||Object.keys(S.ev).length||Object.keys(S.ph).length||Object.keys(S.st).length){S.ts=S.ts||Date.now();push()}else $('#cs').textContent='☁ synced'}
  else $('#cs').textContent='☁ synced'}catch(e){}}
$('#rz').onpointerdown=e=>{e.preventDefault();const rz=$('#rz'),z=S.sc/100,w0=$('#frame').getBoundingClientRect().width/z,h0=S.ch,x0=e.clientX,y0=e.clientY,rows=document.querySelectorAll('#grid .day').length/7||5;
  rz.setPointerCapture(e.pointerId);
  rz.onpointermove=ev=>{S.cw=Math.max(220,Math.round(w0+(ev.clientX-x0)/z));S.ch=Math.max(36,Math.round(h0+(ev.clientY-y0)/z/rows));apply()};
  rz.onpointerup=()=>{rz.onpointermove=null;document.querySelector('[data-s="ch"]').value=S.ch;save()}};
$('#fit').onclick=()=>{S.cw=0;S.sc=100;S.ch=84;S.ox=0;S.oy=0;document.querySelectorAll('[data-s="sc"],[data-s="ch"]').forEach(i=>i.value=S[i.dataset.s]);save();apply();render()};
/* header: photo banner above, skinny color band behind the month title (same on every month) */
if(S.hd&&S.hd.all){const o=S.hd.all;if(o.m==='col'){if(o.col&&!S.hc)S.hc=o.col}else if(o.src&&!S.hp)S.hp={src:o.src,x:o.x,y:o.y,z:o.z};delete S.hd.all}
const HEX=/^#[0-9a-f]{6}([0-9a-f]{2})?$/i;
function drawHc(){const w=$('#hw'),has=HEX.test(S.hc||'');w.classList.toggle('has',has);
  if(has){$('#hd').style.background=S.hc;const n=parseInt(S.hc.slice(1,7),16),lt=(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255>.62;
    w.style.setProperty('--ht',lt?'#2b2426':'#fff');w.style.setProperty('--hs',lt?'none':'0 1px 3px #0005')}
  $('#hcs').style.background=has?S.hc:'var(--grid)'}
function posHd(h){const i=$('#ph .hi');if(!i)return;i.style.backgroundPosition=h.x+'% '+h.y+'%';i.style.transformOrigin=h.x+'% '+h.y+'%';i.style.transform='scale('+h.z/100+')'}
function drawHd(){const h=S.hp,el=$('#ph');drawHc();
  if(!h){el.className='';el.style.height='';el.innerHTML='<button class="b" id="hadd">＋ Header photo</button>';return}
  el.className='on';el.style.height=S.hh+'px';
  el.innerHTML='<div class="hi"></div><div class="hc"><button class="b" id="hch">Change</button><button class="b" data-z="-10">－</button><button class="b" data-z="10">＋</button><button class="b" id="hrm">Remove</button></div>';
  $('#ph .hi').style.backgroundImage="url('"+h.src+"')";posHd(h)}
function openHc(){cp.k='hdc';$('#cpt').textContent='Header color';const c=HEX.test(S.hc||'')?S.hc:'#e58fa8';loadHex(c);$('#hex').value=c;$('#cpw').style.display='flex';drawWheel()}
$('#hcs').onclick=()=>{if(!HEX.test(S.hc||'')){const c=curCol('accent');S.hc=HEX.test(c)?c:'#e58fa8';drawHc();save()}openHc()};
$('#hcx').onclick=()=>{S.hc='';drawHc();save()};
$('#ph').addEventListener('click',e=>{const t=e.target;
  if(t.id==='hadd'||t.id==='hch')$('#hf').click();
  else if(t.id==='hrm'){S.hp=null;save();drawHd()}
  else if(t.dataset.z){S.hp.z=Math.max(100,S.hp.z+ +t.dataset.z);save();posHd(S.hp)}});
$('#hf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;S.hp={src:await shrink(f,1000),x:50,y:50,z:100};save();drawHd()};
$('#ph').addEventListener('pointerdown',e=>{const h=S.hp;if(!h||e.target.closest('.hc'))return;e.preventDefault();
  const el=$('#ph'),r=el.getBoundingClientRect(),x0=e.clientX,y0=e.clientY,hx=h.x,hy=h.y;el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{h.x=Math.min(100,Math.max(0,hx-(ev.clientX-x0)/r.width*100));h.y=Math.min(100,Math.max(0,hy-(ev.clientY-y0)/r.height*100));posHd(h)};
  el.onpointerup=()=>{el.onpointermove=null;save()}});
function startMove(e){e.preventDefault();const z=S.sc/100,x0=e.clientX,y0=e.clientY,ox=S.ox||0,oy=S.oy||0,t=e.currentTarget;t.setPointerCapture(e.pointerId);
  t.onpointermove=ev=>{S.ox=Math.round(ox+(ev.clientX-x0)/z);S.oy=Math.round(oy+(ev.clientY-y0)/z);apply()};
  t.onpointerup=()=>{t.onpointermove=null;save()}}
$('#mv').onpointerdown=startMove;
$('#tb').onpointerdown=e=>{if(document.body.classList.contains('retro'))startMove(e)};
$('#pgs').onclick=()=>{if(!S.pg){S.pg='#f3eaec';apply()}cp.k='pgc';$('#cpt').textContent='Page background';loadHex(S.pg);$('#hex').value=S.pg;$('#cpw').style.display='flex';drawWheel()};
$('#pgx').onclick=()=>{S.pg='';apply();save()};
function drawBx(){const w=$('#wk'),g=$('#grid'),ck='repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px',hw=HEX.test(S.wb||''),hg=HEX.test(S.gb||'');
  w.classList.toggle('bx',hw);w.style.background=hw?S.wb:'';
  if(hw){const n=parseInt(S.wb.slice(1,7),16);w.style.color=(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255>.62?'#2b2426':'#fff'}else w.style.color='';
  g.style.background=hg?S.gb:'';$('#wbs').style.background=hw?S.wb:ck;$('#gbs').style.background=hg?S.gb:ck}
function openBx(key,f,title,def){if(!HEX.test(S[f]||'')){S[f]=def;drawBx();save()}cp.k=key;$('#cpt').textContent=title;loadHex(S[f]);$('#hex').value=S[f];$('#cpw').style.display='flex';drawWheel()}
$('#wbs').onclick=()=>openBx('wbc','wb','Weekday bar','#d9b8c4');
$('#gbs').onclick=()=>openBx('gbc','gb','Days box','#f6e9ee');
$('#wbx').onclick=()=>{S.wb='';drawBx();save()};
$('#gbx').onclick=()=>{S.gb='';drawBx();save()};
const PX="'Pixelify Sans',monospace";
document.querySelector('[data-s="style"]').addEventListener('input',()=>{if(S.style==='retro'&&S.font!==PX)S.font=PX;else if(S.style==='plain'&&S.font===PX)S.font="'DM Sans',system-ui,sans-serif";document.querySelector('[data-s="font"]').value=S.font;save();apply();render()});
apply();render();initSync();
</script></body></html>
